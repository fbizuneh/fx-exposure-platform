# Local PostgreSQL, the same major version as the current application (17).
# Tests reset schemas, so this database's name must end in _test.
#   docker compose up -d
#   export TEST_DATABASE_URL=postgres://fx:fx_local@localhost:5432/fx_platform_test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fx_local
      POSTGRES_DB: fx_platform_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx -d fx_platform_test"]
      interval: 5s
      timeout: 5s
      retries: 10
